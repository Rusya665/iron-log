name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'media/**'
      - '.gitignore'
      - 'LICENSE'
    tags:
      - 'v*' # Trigger on version tags, e.g., v1.0.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Grant write permissions so the action can create a Release
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Inject Version into Python code
      run: |
        $VERSION = '${{ github.ref_name }}'.TrimStart('v')
        (Get-Content core/version.py) -replace '__version__ = ".*"', "__version__ = ""$VERSION""" | Set-Content core/version.py

    - name: Install UPX
      uses: crazy-max/ghaction-upx@v3
      with:
        install-only: true

    - name: Build with PyInstaller
      run: |
        pyinstaller iron_log.spec --upx-dir ${{ env.UPX_INSTALL_DIR }}

    - name: Inject Version into Installer
      run: |
        $VERSION = '${{ github.ref_name }}'.TrimStart('v')
        (Get-Content installer/iron_log_setup.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion ""$VERSION""" | Set-Content installer/iron_log_setup.iss

    - name: Compile Inno Setup Installer
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: installer/iron_log_setup.iss

    - name: Extract Tag Message
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        git tag -l --format='%(contents)' ${{ github.ref_name }} > RELEASE_NOTES.md

    - name: Create Release and Upload Asset
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: installer/Output/IronLog_Setup_*.exe
        body_path: RELEASE_NOTES.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
