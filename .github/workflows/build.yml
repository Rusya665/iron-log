name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - gui-engines-comparison
    paths-ignore:
      - '**.md'
      - 'media/**'
      - '.gitignore'
      - 'LICENSE'
    tags:
      - 'v*' # Trigger on version tags, e.g., v1.0.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Grant write permissions so the action can create a Release
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Inject Version if Tagged
      shell: pwsh
      run: |
        if ('${{ github.ref }}' -like 'refs/tags/v*') {
            $VERSION = '${{ github.ref_name }}'.TrimStart('v')
            (Get-Content core/version.py) -replace '__version__ = ".*"', "__version__ = ""$VERSION""" | Set-Content core/version.py
            (Get-Content installer/iron_log_setup.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion ""$VERSION""" | Set-Content installer/iron_log_setup.iss
        }

    - name: Build with PyInstaller
      run: |
        pyinstaller iron_log.spec

    - name: Compile Inno Setup Installer
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: installer/iron_log_setup.iss

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IronLog-Setup-Windows
        path: installer/Output/*.exe
        if-no-files-found: warn

    - name: Upload Standalone EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IronLog-Standalone-EXE
        path: dist/IronLog.exe
        if-no-files-found: warn

    - name: Extract Tag Message
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        git tag -l --format='%(contents)' ${{ github.ref_name }} > RELEASE_NOTES.md

    - name: Create Release and Upload Asset
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: installer/Output/IronLog_Setup_*.exe
        body_path: RELEASE_NOTES.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
