name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'media/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Grant write permissions so the action can create a Release
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Resolve and Inject Version
      shell: pwsh
      run: |
        $match = Select-String -Path core/version.py -Pattern '__version__\s*=\s*"(.*)"'
        if ($match) {
            $VERSION = $match.Matches[0].Groups[1].Value
        } else {
            $VERSION = "2.0.0"
        }
        Write-Host "Resolved Version: $VERSION"
        (Get-Content installer/iron_log_setup.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion ""$VERSION""" | Set-Content installer/iron_log_setup.iss
        echo "APP_VERSION=$VERSION" >> $env:GITHUB_ENV

    - name: Build with PyInstaller
      run: |
        pyinstaller iron_log.spec

    - name: Compile Inno Setup Installer
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: installer/iron_log_setup.iss

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IronLog-Setup-Windows
        path: installer/Output/*.exe
        if-no-files-found: warn

    - name: Upload Standalone EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IronLog-Standalone-EXE
        path: dist/IronLog.exe
        if-no-files-found: warn

    - name: Extract Commit Message for Release Notes
      if: github.ref == 'refs/heads/main'
      shell: pwsh
      run: |
        git log -1 --pretty=%B | Out-File -FilePath RELEASE_NOTES.md -Encoding utf8

    - name: Create Release and Upload Asset
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.APP_VERSION }}
        name: Iron Log v${{ env.APP_VERSION }}
        files: installer/Output/IronLog_Setup_*.exe
        body_path: RELEASE_NOTES.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
