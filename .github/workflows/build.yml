name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g., v1.0.0

# Grant write permissions so the action can create a Release
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Inject Version into Python code
      run: |
        $VERSION = '${{ github.ref_name }}'.TrimStart('v')
        (Get-Content core/version.py) -replace '__version__ = ".*"', "__version__ = ""$VERSION""" | Set-Content core/version.py

    - name: Build with PyInstaller
      run: |
        pyinstaller iron_log.spec

    - name: Inject Version into Installer
      run: |
        $VERSION = '${{ github.ref_name }}'.TrimStart('v')
        (Get-Content installer/iron_log_setup.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion ""$VERSION""" | Set-Content installer/iron_log_setup.iss

    - name: Compile Inno Setup Installer
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: installer/iron_log_setup.iss

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        files: installer/Output/IronLog_Setup_*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
